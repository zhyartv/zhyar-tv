<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ئافەرین تیڤی - پەخشی ڕاستەوخۆ</title>

    <!-- HLS.js Library بۆ پشتیوانیکردنی لینکی m3u8 -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <!-- FontAwesome برای ئایکۆنەکان -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-color: #ff4757;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* هەدەر / سەرپەڕە */
        header {
            background-color: var(--card-bg);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 22px;
            font-weight: bold;
            color: var(--primary-color);
        }

        .live-badge {
            background-color: var(--primary-color);
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        /* بەشی ناوەڕۆک */
        main {
            flex: 1;
            max-width: 1000px;
            width: 90%;
            margin: 30px auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .player-container {
            background-color: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
        }

        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background-color: #000;
        }

        .channel-info {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .channel-details h1 {
            font-size: 20px;
            margin-bottom: 5px;
        }

        .channel-details p {
            color: var(--text-muted);
            font-size: 14px;
        }

        .btn-refresh {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.3s;
        }

        .btn-refresh:hover {
            opacity: 0.9;
        }

        /* فوتەر / خوارەوە */
        footer {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            font-size: 14px;
            background-color: var(--card-bg);
            margin-top: auto;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <i class="fa-solid fa-tv"></i>
            <span>ئافەرین تیڤی</span>
        </div>
        <div class="live-badge">
            <i class="fa-solid fa-circle"></i> پەخشی ڕاستەوخۆ
        </div>
    </header>

    <main>
        <div class="player-container">
            <video id="video" controls autoplay muted></video>
        </div>

        <div class="channel-info">
            <div class="channel-details">
                <h1>کەناڵی ئافەرین (Afarin TV)</h1>
                <p>سەیری پەخشی ڕاستەوخۆی کەناڵی ئافەرین بکە بە کوالێتی بەرز</p>
            </div>
            <button class="btn-refresh" onclick="reloadStream()">
                <i class="fa-solid fa-rotate-right"></i> دیسان بارکردنەوە
            </button>
        </div>
    </main>

    <footer>
        <p>سەرجەم مافەکانی پارێزراوە &copy; 2026 - ئافەرین تیڤی</p>
    </footer>

    <script>
        const video = document.getElementById('video');
        const streamUrl = 'http://afarintv2.flashmediacast.com:1935/afarinTV/d1/livestream/chunklist_w1772259073.m3u8';

        function loadStream() {
            if (Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(streamUrl);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function () {
                    video.play();
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                // بۆ وێبگەڕەکانی Safari و iOS
                video.src = streamUrl;
                video.addEventListener('loadedmetadata', function () {
                    video.play();
                });
            } else {
                alert('وێبگەڕەکەت پشتیوانی ئەم جۆرە پەخشە ناکات.');
            }
        }

        function reloadStream() {
            loadStream();
        }

        // دەستپێکردنی پەخش لە کاتی باربوونی پەڕەکەدا
        window.onload = loadStream;
    </script>

</body>
</html>
