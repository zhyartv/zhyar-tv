<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ڵایڤ چات</title>
  <style>
    body { font-family: sans-serif; background-color: #121212; color: #fff; margin: 0; padding: 15px; }
    .chat-container { max-width: 400px; margin: 0 auto; background: #1e1e1e; border-radius: 12px; padding: 15px; display: flex; flex-direction: column; height: 85vh; }
    .chat-box { flex: 1; overflow-y: auto; border: 1px solid #333; padding: 10px; border-radius: 8px; margin-bottom: 10px; background: #000; }
    .msg { margin: 8px 0; padding: 8px 12px; border-radius: 15px; max-width: 75%; word-wrap: break-word; }
    .my-msg { background: #0084ff; margin-right: auto; text-align: right; }
    .other-msg { background: #333; margin-left: auto; text-align: right; }
    .input-box { display: flex; gap: 8px; }
    input { flex: 1; padding: 10px; border-radius: 20px; border: none; background: #2a2a2a; color: #fff; outline: none; }
    button { padding: 10px 18px; border-radius: 20px; border: none; background: #FFFC00; color: #000; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

<div class="chat-container">
  <h3>💬 ڵایڤ چات</h3>
  <div class="chat-box" id="chatBox"></div>
  <div class="input-box">
    <input type="text" id="msgInput" placeholder="پەیامێک بنووسە...">
    <button onclick="sendMessage()">ناردن</button>
  </div>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
  // 1. زانیارییەکانی Firebase لێرە دابنێ
  const firebaseConfig = {
    databaseURL: "https://live-chat-999db-default-rtdb.firebaseio.com"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // دروستکردنی IDی تەواو تایبەت بۆ بەکارهێنەر
  const myUserId = "user_" + Math.random().toString(36).substr(2, 9);

  const chatBox = document.getElementById("chatBox");
  const msgInput = document.getElementById("msgInput");

  // 2. گوێگرتن لە پەیامە نوێیەکان لە کاتی ڕاستەقینەدا
  db.ref("messages").on("child_added", (snapshot) => {
    const data = snapshot.val();
    const msgDiv = document.createElement("div");
    
    // جیاکردنەوەی پەیامی خۆت لە کەسانی تر
    if (data.sender === myUserId) {
      msgDiv.className = "msg my-msg";
      msgDiv.textContent = data.text;
    } else {
      msgDiv.className = "msg other-msg";
      msgDiv.textContent = data.text;
    }

    chatBox.appendChild(msgDiv);
    chatBox.scrollTop = chatBox.scrollHeight; // خۆکارانە دەچێتە خوارەوەی چاتەکە
  });

  // 3. ناردنی پەیام بۆ داتابەیس
  function sendMessage() {
    const text = msgInput.value.trim();
    if (text !== "") {
      db.ref("messages").push({
        sender: myUserId,
        text: text,
        timestamp: Date.now()
      });
      msgInput.value = "";
    }
  }

  // ناردنی پەیام بە داگرتنی Enter
  msgInput.addEventListener("keypress", function(e) {
    if (e.key === "Enter") sendMessage();
  });
</script>

</body>
</html>
