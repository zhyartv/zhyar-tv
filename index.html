<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ڵایڤ چات</title>
  <style>
    body { font-family: sans-serif; background-color: #121212; color: #fff; margin: 0; padding: 15px; }
    .chat-container { max-width: 400px; margin: 0 auto; background: #1e1e1e; border-radius: 12px; padding: 15px; display: flex; flex-direction: column; height: 85vh; }
    .chat-box { flex: 1; overflow-y: auto; border: 1px solid #333; padding: 10px; border-radius: 8px; margin-bottom: 10px; background: #000; }
    .msg { margin: 8px 0; padding: 8px 12px; border-radius: 15px; max-width: 80%; word-wrap: break-word; }
    .my-msg { background: #0084ff; margin-right: auto; text-align: right; }
    .other-msg { background: #333; margin-left: auto; text-align: right; }
    .sender-name { font-size: 11px; opacity: 0.8; margin-bottom: 3px; display: block; font-weight: bold; }
    .input-box { display: flex; gap: 8px; }
    input { flex: 1; padding: 10px; border-radius: 20px; border: none; background: #2a2a2a; color: #fff; outline: none; }
    button { padding: 10px 18px; border-radius: 20px; border: none; background: #FFFC00; color: #000; font-weight: bold; cursor: pointer; }
    
    /* پەڕەی چوونەژوورەوە بۆ داواکردنی ناو */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 100; }
    .modal-card { background: #1e1e1e; padding: 25px; border-radius: 12px; text-align: center; max-width: 300px; width: 80%; border: 1px solid #333; }
    .modal-card input { width: 90%; margin-bottom: 15px; text-align: center; }
  </style>
</head>
<body>

<!-- بەشی داواکردنی ناو -->
<div class="modal-overlay" id="nameModal">
  <div class="modal-card">
    <h3>تکایە ناوەکەت بنووسە</h3>
    <input type="text" id="usernameInput" placeholder="ناوەکەت لێرە بنووسە..." maxlength="20">
    <br>
    <button onclick="saveUsername()">چوونەژوورەوە</button>
  </div>
</div>

<!-- بەشی چاتەکە -->
<div class="chat-container">
  <h3>💬 ئەم ڵایڤ چاتە تایبەت بە خۆمان دروستکراوە</h3>
  <div class="chat-box" id="chatBox"></div>
  <div class="input-box">
    <input type="text" id="msgInput" placeholder="پەیامێک بنووسە...">
    <button onclick="sendMessage()">ناردن</button>
  </div>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
  // 1. ڕێکخستنی Firebase
  const firebaseConfig = {
    databaseURL: "https://live-chat-999db-default-rtdb.firebaseio.com"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const myUserId = "user_" + Math.random().toString(36).substr(2, 9);
  let currentUsername = "";

  const chatBox = document.getElementById("chatBox");
  const msgInput = document.getElementById("msgInput");
  const nameModal = document.getElementById("nameModal");

  // 2. پاشەکەوتکردنی ناوی بەکارهێنەر
  function saveUsername() {
    const input = document.getElementById("usernameInput").value.trim();
    if (input !== "") {
      currentUsername = input;
      nameModal.style.display = "none";
    }
  }

  // 3. گوێگرتن لە پەیامەکان لە کاتی ڕاستەقینەدا
  const FIVE_MINUTES = 5 * 60 * 1000; // ٥ خولەک بە میلی‌چرکە

  db.ref("messages").on("child_added", (snapshot) => {
    const data = snapshot.val();
    const key = snapshot.key;
    const now = Date.now();

    // ئەگەر تەمەنی پەیامەکە لە ٥ خولەک زیاتر بوو، دەستبەجێ بی سڕەوە
    if (now - data.timestamp > FIVE_MINUTES) {
      db.ref("messages/" + key).remove();
      return;
    }

    const msgDiv = document.createElement("div");
    msgDiv.id = "msg-" + key;
    
    const senderSpan = document.createElement("span");
    senderSpan.className = "sender-name";
    senderSpan.textContent = data.username || "بەکارهێنەر";

    const textSpan = document.createElement("span");
    textSpan.textContent = data.text;

    msgDiv.appendChild(senderSpan);
    msgDiv.appendChild(textSpan);

    if (data.sender === myUserId) {
      msgDiv.className = "msg my-msg";
    } else {
      msgDiv.className = "msg other-msg";
    }

    chatBox.appendChild(msgDiv);
    chatBox.scrollTop = chatBox.scrollHeight;

    // دانانی کاتژمێرێک بۆ سڕینەوەی ئەم پەیامە کاتێک ٥ خولەکەکەی تەواو دەبێت
    const timeLeft = FIVE_MINUTES - (now - data.timestamp);
    setTimeout(() => {
      db.ref("messages/" + key).remove();
    }, timeLeft);
  });

  // 4. لابردنی پەیامەکە لە سەر شاشەکە کاتێک لە داتابەیس دەسڕدرێتەوە
  db.ref("messages").on("child_removed", (snapshot) => {
    const key = snapshot.key;
    const el = document.getElementById("msg-" + key);
    if (el) {
      el.remove();
    }
  });

  // 5. ناردنی پەیام
  function sendMessage() {
    const text = msgInput.value.trim();
    if (text !== "" && currentUsername !== "") {
      db.ref("messages").push({
        sender: myUserId,
        username: currentUsername,
        text: text,
        timestamp: Date.now()
      });
      msgInput.value = "";
    }
  }

  msgInput.addEventListener("keypress", function(e) {
    if (e.key === "Enter") sendMessage();
  });
</script>

</body>
</html>
